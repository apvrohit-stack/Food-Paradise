<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Paradise - Food Management</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <h1>Food Paradise</h1>
    <p>REST API Lab — Food Management</p>

    <section class="panel">
      <h2 id="formTitle">Add Food Item</h2>
      <form id="foodForm">
        <input id="name" placeholder="Food name" required>
        <select id="type">
          <option value="Diet">Diet</option>
          <option value="Normal">Normal</option>
        </select>
        <input id="price" type="number" min="0" step="0.01"
          placeholder="Price (₹)" required>
        <input id="calories" type="number" min="0"
          placeholder="Calories" required>
        <button type="submit">Save Food</button>
        <button type="button" id="cancelEdit" hidden>Cancel Edit</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section class="panel">
      <h2>Menu Records</h2>
      <button type="button" id="refresh">Refresh</button>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Food Name</th><th>Category</th>
              <th>Price</th><th>Calories</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="foodTable"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
